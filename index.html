<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お菓子詰め合わせ 予算・パック数計算ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background: white; color: black; }
      .shadow-sm, .shadow-md, .shadow-lg { box-shadow: none !important; }
      .border { border-color: #ccc !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- ヘッダー -->
  <header class="bg-indigo-600 text-white shadow-md no-print mb-6">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-500 p-2 rounded-lg text-2xl">
          <i class="fa-solid font-bold fa-file-invoice-dollar"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-wide">お菓子詰め合わせ 予算計算ツール</h1>
          <p class="text-xs text-indigo-200">作業内容はブラウザに自動保存されます</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="resetToSample()" class="px-3 py-1.5 bg-indigo-700 hover:bg-indigo-800 text-indigo-100 text-xs rounded transition flex items-center gap-1.5">
          <i class="fa-solid fa-rotate-left"></i> データを初期化
        </button>
        <button onclick="window.print()" class="px-3 py-1.5 bg-white text-indigo-600 font-medium hover:bg-indigo-50 text-xs rounded shadow-sm transition flex items-center gap-1.5">
          <i class="fa-solid fa-print"></i> 印刷 / PDF保存
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- 左カラム：お菓子パック登録＆一覧 -->
    <section class="lg:col-span-7 space-y-6">

      <!-- お菓子パック追加フォーム -->
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm no-print">
        <h2 class="text-base font-bold text-slate-700 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-plus-circle text-indigo-500"></i> 新しいお菓子パックを追加
        </h2>
        <form id="add-snack-form" onsubmit="handleAddSnack(event)" class="grid grid-cols-1 sm:grid-cols-12 gap-3">
          <div class="sm:col-span-5">
            <label class="block text-xs font-medium text-slate-500 mb-1">お菓子名・商品名</label>
            <input type="text" id="input-name" required placeholder="例: うまい棒 30本入" 
                   class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div class="sm:col-span-3">
            <label class="block text-xs font-medium text-slate-500 mb-1">パック価格 (円)</label>
            <input type="number" id="input-price" required min="1" placeholder="360" 
                   class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div class="sm:col-span-2">
            <label class="block text-xs font-medium text-slate-500 mb-1">個包装数</label>
            <input type="number" id="input-count" required min="1" placeholder="30" 
                   class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div class="sm:col-span-2 flex items-end">
            <button type="submit" class="w-full py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-md transition shadow-sm">
              追加
            </button>
          </div>
        </form>
      </div>

      <!-- 登録お菓子マスター一覧 兼 構成設定 -->
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
          <h2 class="font-bold text-slate-700 flex items-center gap-2">
            <i class="fa-solid fa-cookie-bite text-amber-500"></i> お菓子一覧 & 1袋への封入数
          </h2>
          <span class="text-xs text-slate-500">※個包装単価は小数点以下切り上げ</span>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-100 text-slate-600 text-xs uppercase border-b border-slate-200">
              <tr>
                <th class="p-3">商品名</th>
                <th class="p-3 text-right">パック価格</th>
                <th class="p-3 text-right">個数</th>
                <th class="p-3 text-right bg-amber-50/50 text-amber-900">単価(切上)</th>
                <th class="p-3 text-center no-print" style="width: 110px;">1袋に入れる量</th>
                <th class="p-3 text-right">1袋あたり小計</th>
                <th class="p-3 text-center no-print" style="width: 50px;">操作</th>
              </tr>
            </thead>
            <tbody id="snack-table-body" class="divide-y divide-slate-100">
              <!-- JSで動的生成 -->
            </tbody>
          </table>
        </div>
      </div>

    </section>

    <!-- 右カラム：詰め合わせ全体計算・要約 -->
    <section class="lg:col-span-5 space-y-6">

      <!-- 詰め合わせ1袋の合計 ＆ 目標セット数 -->
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-5">
        <div class="border-b border-slate-100 pb-3">
          <h2 class="font-bold text-slate-700 text-base flex items-center gap-2">
            <i class="fa-solid fa-box text-indigo-500"></i> 詰め合わせセット全体計算
          </h2>
        </div>

        <!-- 1袋あたりの計算 -->
        <div class="bg-amber-50 border border-amber-200 rounded-lg p-4 flex justify-between items-center">
          <div>
            <span class="text-xs font-bold text-amber-800 uppercase tracking-wider block">詰め合わせ 1袋あたり</span>
            <span class="text-xs text-amber-600">個包装単価（切り上げ）の合計</span>
          </div>
          <div class="text-right">
            <span id="unit-set-price" class="text-2xl font-black text-amber-900">0</span>
            <span class="text-sm font-bold text-amber-900">円 / 袋</span>
          </div>
        </div>

        <!-- セット数入力 -->
        <div class="no-print">
          <label class="block text-xs font-bold text-slate-600 mb-1">作成したいセット数（例: 参加人数）</label>
          <div class="flex items-center gap-2">
            <input type="number" id="input-target-sets" value="50" min="1" onchange="updateTargetSets(this.value)"
                   class="w-full px-3 py-2 border border-slate-300 rounded-md font-bold text-lg text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <span class="text-sm font-bold text-slate-600 whitespace-nowrap">セット</span>
          </div>
        </div>

        <hr class="border-slate-100">

        <!-- 全体予算合計 -->
        <div class="space-y-3">
          <div class="flex justify-between items-baseline">
            <span class="text-sm text-slate-600 font-medium">1袋単価 × <span id="summary-sets-count">50</span>袋</span>
            <span class="text-base font-bold text-slate-700"><span id="summary-pure-total">0</span> 円</span>
          </div>

          <div class="bg-indigo-50 border border-indigo-100 rounded-lg p-4">
            <div class="flex justify-between items-baseline mb-1">
              <span class="text-xs font-bold text-indigo-900 uppercase">買い出しに必要な【総予算】</span>
              <span class="text-xs text-indigo-600">※パック単位購入の合計額</span>
            </div>
            <div class="text-right">
              <span id="summary-actual-cost" class="text-3xl font-black text-indigo-600">0</span>
              <span class="text-sm font-bold text-indigo-900">円</span>
            </div>
          </div>
        </div>

        <button onclick="copySummaryText()" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-md transition flex items-center justify-center gap-1.5 no-print">
          <i class="fa-regular fa-copy"></i> 内訳テキストをコピー
        </button>
      </div>

      <!-- 必要な買い出しパック数内訳 -->
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <h3 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-cart-shopping text-emerald-500"></i> 買い出しパック数 内訳
        </h3>
        <div id="shopping-list" class="space-y-2 text-sm divide-y divide-slate-100">
          <!-- JSで動的生成 -->
        </div>
      </div>

    </section>

  </main>

  <script>
    // デフォルトの初期サンプルデータ
    const DEFAULT_SNACKS = [
      { id: '1', name: 'うまい棒 (30本入)', price: 360, count: 30, perBag: 1 },
      { id: '2', name: 'ハッピーターン ミニ (20袋)', price: 420, count: 20, perBag: 1 },
      { id: '3', name: 'ブラックサンダー (20個)', price: 460, count: 20, perBag: 1 },
      { id: '4', name: 'フルーツキャンディ (50粒)', price: 300, count: 50, perBag: 2 }
    ];

    let snacks = [];
    let targetSets = 50;

    // 読み込み時にlocalStorageからデータ取得
    window.addEventListener('DOMContentLoaded', () => {
      loadDataFromLocalStorage();
      render();
    });

    // localStorageから読み込み
    function loadDataFromLocalStorage() {
      const savedSnacks = localStorage.getItem('okashi_calc_snacks');
      const savedSets = localStorage.getItem('okashi_calc_target_sets');

      if (savedSnacks) {
        try {
          snacks = JSON.parse(savedSnacks);
        } catch (e) {
          snacks = DEFAULT_SNACKS;
        }
      } else {
        snacks = DEFAULT_SNACKS;
      }

      if (savedSets) {
        targetSets = parseInt(savedSets, 10) || 50;
      }

      document.getElementById('input-target-sets').value = targetSets;
    }

    // localStorageへ保存
    function saveDataToLocalStorage() {
      localStorage.setItem('okashi_calc_snacks', JSON.stringify(snacks));
      localStorage.setItem('okashi_calc_target_sets', targetSets.toString());
    }

    // データを初期状態にリセット
    function resetToSample() {
      if (confirm('登録した内容を初期状態（サンプルデータ）に戻しますか？')) {
        snacks = JSON.parse(JSON.stringify(DEFAULT_SNACKS));
        targetSets = 50;
        document.getElementById('input-target-sets').value = targetSets;
        saveDataToLocalStorage();
        render();
      }
    }

    // お菓子追加処理
    function handleAddSnack(e) {
      e.preventDefault();
      const nameInput = document.getElementById('input-name');
      const priceInput = document.getElementById('input-price');
      const countInput = document.getElementById('input-count');

      const newSnack = {
        id: Date.now().toString(),
        name: nameInput.value.trim(),
        price: Number(priceInput.value),
        count: Number(countInput.value),
        perBag: 1
      };

      snacks.push(newSnack);
      saveDataToLocalStorage();
      render();

      nameInput.value = '';
      priceInput.value = '';
      countInput.value = '';
      nameInput.focus();
    }

    // 削除処理
    function deleteSnack(id) {
      snacks = snacks.filter(item => item.id !== id);
      saveDataToLocalStorage();
      render();
    }

    // 1袋あたりの個数変更
    function updatePerBag(id, val) {
      const num = Math.max(0, parseInt(val, 10) || 0);
      const target = snacks.find(s => s.id === id);
      if (target) {
        target.perBag = num;
        saveDataToLocalStorage();
        render();
      }
    }

    // 目標セット数変更
    function updateTargetSets(val) {
      targetSets = Math.max(1, parseInt(val, 10) || 1);
      saveDataToLocalStorage();
      render();
    }

    // 画面再描画・再計算
    function render() {
      const tbody = document.getElementById('snack-table-body');
      tbody.innerHTML = '';

      let unitBagTotal = 0;

      snacks.forEach(snack => {
        // 個包装1個あたりの単価（切り上げ）
        const unitPrice = Math.ceil(snack.price / snack.count);
        // 1袋あたりの小計（単価 × 封入数）
        const subtotal = unitPrice * snack.perBag;
        unitBagTotal += subtotal;

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50 transition-colors';
        tr.innerHTML = `
          <td class="p-3 font-medium text-slate-800">${escapeHtml(snack.name)}</td>
          <td class="p-3 text-right text-slate-600">${snack.price.toLocaleString()}円</td>
          <td class="p-3 text-right text-slate-600">${snack.count}個</td>
          <td class="p-3 text-right font-bold text-amber-700 bg-amber-50/30">${unitPrice}円</td>
          <td class="p-3 text-center no-print">
            <input type="number" min="0" value="${snack.perBag}" 
                   onchange="updatePerBag('${snack.id}', this.value)"
                   class="w-16 px-2 py-1 text-center border border-slate-300 rounded focus:ring-2 focus:ring-indigo-500 focus:outline-none font-bold">
          </td>
          <td class="p-3 text-right font-bold text-slate-800">${subtotal.toLocaleString()}円</td>
          <td class="p-3 text-center no-print">
            <button onclick="deleteSnack('${snack.id}')" class="text-slate-400 hover:text-red-500 p-1 transition">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // 単価合計・セット数計算
      document.getElementById('unit-set-price').textContent = unitBagTotal.toLocaleString();
      document.getElementById('summary-sets-count').textContent = targetSets.toLocaleString();
      document.getElementById('summary-pure-total').textContent = (unitBagTotal * targetSets).toLocaleString();

      // 買い出し内訳リストの計算
      const shoppingListEl = document.getElementById('shopping-list');
      shoppingListEl.innerHTML = '';

      let actualTotalCost = 0;

      if (snacks.length === 0) {
        shoppingListEl.innerHTML = '<p class="text-xs text-slate-400 py-2 text-center">お菓子が登録されていません</p>';
      }

      snacks.forEach(snack => {
        if (snack.perBag <= 0) return;

        const totalNeededPieces = snack.perBag * targetSets; // 必要な総個包装数
        const requiredPacks = Math.ceil(totalNeededPieces / snack.count); // 必要な買い出しパック数（切り上げ）
        const packCost = requiredPacks * snack.price; // このお菓子の実際の購入費用
        const surplusPieces = (requiredPacks * snack.count) - totalNeededPieces; // 余る個数

        actualTotalCost += packCost;

        const item = document.createElement('div');
        item.className = 'pt-2 flex justify-between items-start';
        item.innerHTML = `
          <div>
            <div class="font-medium text-slate-800">${escapeHtml(snack.name)}</div>
            <div class="text-xs text-slate-500">
              必要: ${totalNeededPieces}個 ➔ <span class="font-bold text-indigo-600">${requiredPacks}パック</span>
              ${surplusPieces > 0 ? `<span class="text-slate-400">（${surplusPieces}個あまり）</span>` : ''}
            </div>
          </div>
          <div class="text-right font-bold text-slate-700">
            ${packCost.toLocaleString()}円
          </div>
        `;
        shoppingListEl.appendChild(item);
      });

      document.getElementById('summary-actual-cost').textContent = actualTotalCost.toLocaleString();
    }

    // HTMLエスケープ関数
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // 内訳コピー機能
    function copySummaryText() {
      let unitBagTotal = 0;
      let text = `【お菓子詰め合わせ 予算計算内訳】\n`;
      text += `作成セット数: ${targetSets}セット\n------------------------------\n`;

      snacks.forEach(s => {
        const uPrice = Math.ceil(s.price / s.count);
        const sub = uPrice * s.perBag;
        unitBagTotal += sub;
        text += `・${s.name}: 1袋${s.perBag}個 (${uPrice}円/個) = ${sub}円\n`;
      });

      text += `------------------------------\n1袋あたり単価合計: ${unitBagTotal}円\n`;
      text += `単純合計 (${targetSets}セット): ${unitBagTotal * targetSets}円\n\n`;
      text += `【買い出しに必要なパック数】\n`;

      let totalCost = 0;
      snacks.forEach(s => {
        if (s.perBag <= 0) return;
        const totalP = s.perBag * targetSets;
        const packs = Math.ceil(totalP / s.count);
        const cost = packs * s.price;
        totalCost += cost;
        text += `・${s.name}: ${packs}パック (${cost}円)\n`;
      });

      text += `------------------------------\n買い出し総予算: ${totalCost}円`;

      navigator.clipboard.writeText(text).then(() => {
        alert('クリップボードに内訳テキストをコピーしました！LINEやチャットに貼り付けられます。');
      }).catch(() => {
        alert('コピーに失敗しました。');
      });
    }
  </script>
</body>
</html>
